<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PHONEDLE — Handset Wordle</title>
  <style>
    :root {
      --bg: #121213;
      --card-bg: #1a1a1b;
      --text: #ffffff;
      --subtext: #818384;
      --border: #3a3a3c;
      --correct: #538d4e;
      --absent: #3a3a3c;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    header {
      width: 100%;
      max-width: 600px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 20px;
    }
    header h1 { font-size: 2rem; letter-spacing: 2px; }
    header p { color: var(--subtext); font-size: 0.85rem; margin-top: 4px; }
    #game-container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 16px; }
    .input-row { display: flex; gap: 8px; position: relative; }
    input[type="text"] {
      flex: 1;
      padding: 12px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: #fff;
      font-size: 1rem;
      outline: none;
    }
    button#submit-btn {
      padding: 0 16px;
      background: var(--correct);
      border: none;
      color: #fff;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }
    button#submit-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    #suggestions {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: var(--card-bg);
      border: 1px solid var(--border);
      max-height: 180px;
      overflow-y: auto;
      z-index: 10;
      display: none;
    }
    .suggestion-item { padding: 10px; cursor: pointer; border-bottom: 1px solid #272729; }
    .suggestion-item:hover { background: #2f2f31; }
    table { width: 100%; border-collapse: separate; border-spacing: 0 6px; }
    th { color: var(--subtext); font-size: 0.75rem; text-transform: uppercase; padding: 4px; }
    td {
      padding: 10px 4px;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 600;
      border: 1px solid var(--border);
    }
    .cell-correct { background-color: var(--correct); border-color: var(--correct); }
    .cell-absent { background-color: var(--absent); border-color: var(--absent); }
    #end-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .modal-content {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 8px;
      border: 1px solid var(--border);
      text-align: center;
      max-width: 320px;
      width: 100%;
    }
  </style>
</head>
<body>
  <header>
    <h1>PHONLE</h1>
    <p>Guess the mobile handset (2000–2026)</p>
  </header>

  <main id="game-container">
    <div class="input-row">
      <input type="text" id="phone-input" placeholder="Loading phone list..." disabled autocomplete="off" />
      <button id="submit-btn" disabled>GUESS</button>
      <div id="suggestions"></div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Phone</th>
          <th>Brand</th>
          <th>Year</th>
          <th>OS</th>
          <th>Form</th>
        </tr>
      </thead>
      <tbody id="guesses-body"></tbody>
    </table>
  </main>

  <div id="end-modal">
    <div class="modal-content">
      <h2 id="modal-title"></h2>
      <p id="modal-desc" style="margin-top: 8px; color: var(--subtext);"></p>
    </div>
  </div>

  <script>
    let PHONES = [];
    let target = null;
    let attempts = 0;
    const maxAttempts = 6;
    let gameOver = false;

    const input = document.getElementById("phone-input");
    const suggestions = document.getElementById("suggestions");
    const submitBtn = document.getElementById("submit-btn");
    const tbody = document.getElementById("guesses-body");

    async function loadData() {
      try {
        const res = await fetch('./phones.json');
        PHONES = await res.json();

        // Seeded daily pick
        const startDate = new Date("2026-01-01").getTime();
        const dayIndex = Math.floor((new Date().setHours(0,0,0,0) - startDate) / (1000 * 60 * 60 * 24));
        target = PHONES[Math.abs(dayIndex) % PHONES.length];

        input.disabled = false;
        submitBtn.disabled = false;
        input.placeholder = "Type a phone model...";
      } catch (e) {
        input.placeholder = "Failed to load phones.json";
      }
    }

    input.addEventListener("input", () => {
      const val = input.value.trim().toLowerCase();
      suggestions.innerHTML = "";
      if (!val) { suggestions.style.display = "none"; return; }

      const matches = PHONES.filter(p => p.name.toLowerCase().includes(val)).slice(0, 10);
      if (matches.length > 0) {
        suggestions.style.display = "block";
        matches.forEach(m => {
          const div = document.createElement("div");
          div.className = "suggestion-item";
          div.textContent = m.name;
          div.onclick = () => {
            input.value = m.name;
            suggestions.style.display = "none";
          };
          suggestions.appendChild(div);
        });
      } else {
        suggestions.style.display = "none";
      }
    });

    submitBtn.addEventListener("click", handleGuess);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") handleGuess(); });

    function handleGuess() {
      if (gameOver) return;
      const guess = PHONES.find(p => p.name.toLowerCase() === input.value.trim().toLowerCase());
      if (!guess) { alert("Select a phone from the list."); return; }

      attempts++;
      input.value = "";
      suggestions.style.display = "none";

      const tr = document.createElement("tr");
      const yearDiff = guess.year === target.year ? "" : (guess.year < target.year ? " ↑" : " ↓");

      tr.innerHTML = `
        <td class="${guess.name === target.name ? 'cell-correct' : 'cell-absent'}">${guess.name}</td>
        <td class="${guess.brand === target.brand ? 'cell-correct' : 'cell-absent'}">${guess.brand}</td>
        <td class="${guess.year === target.year ? 'cell-correct' : 'cell-absent'}">${guess.year}${yearDiff}</td>
        <td class="${guess.os === target.os ? 'cell-correct' : 'cell-absent'}">${guess.os}</td>
        <td class="${guess.form === target.form ? 'cell-correct' : 'cell-absent'}">${guess.form}</td>
      `;
      tbody.insertBefore(tr, tbody.firstChild);

      if (guess.name === target.name) {
        finish(true);
      } else if (attempts >= maxAttempts) {
        finish(false);
      }
    }

    function finish(won) {
      gameOver = true;
      input.disabled = true;
      submitBtn.disabled = true;
      const modal = document.getElementById("end-modal");
      document.getElementById("modal-title").textContent = won ? "You Won!" : "Game Over";
      document.getElementById("modal-desc").textContent = won 
        ? `Solved in ${attempts}/${maxAttempts} attempts!` 
        : `The handset was: ${target.name}`;
      modal.style.display = "flex";
    }

    loadData();
  </script>
</body>
</html>
